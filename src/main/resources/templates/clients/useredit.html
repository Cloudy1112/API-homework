<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>
		Edit 
		<span th:if="${message != null}" th:text="${message}" style="color: red;"></span>
	</h2>

	<form th:action="@{/user-edit}" method="POST">
		<div>Username</div>
		<input name="username" th:value="${uuid}" readonly="readonly"/>
		<div>Password</div>
		<input name="password" th:value="${password}" />
		<hr>
		<button>Submit</button>
	</form>
</body>
</html>
